services:
  postgres:
    image: postgres:17-alpine
    container_name: trpc-todos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-todos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todos} -d ${POSTGRES_DB:-todos}"]
      interval: 5s
      timeout: 5s
      retries: 10
